name: OpenCode PR Review (GitHub.com Evaluation)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OpenCode Review
        uses: anomalyco/opencode/github@latest
        env:
          AZURE_API_KEY: ${{ secrets.OPENAI_KEY_5 }}
          AZURE_RESOURCE_NAME: "qodo-gpt-5o-mini"
          AZURE_API_VERSION: "2024-12-01-preview"
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        with:
          model: azure/gpt-5
          use_github_token: "true"
          prompt: |
            Review this pull request and provide structured feedback:

            ## 🐛 Bugs or Logic Errors
            List any bugs or logic errors found.

            ## 🔒 Security Issues
            List any security vulnerabilities or concerns.

            ## 📋 Code Quality & Best Practices
            List code quality issues and improvement suggestions.

            ## 🧪 Missing Tests
            List what tests are missing or should be added.

            Keep feedback concise, specific, and actionable.
            Reference file names and line numbers where possible.
